<div class="p-6">
  <h3 class="text-xl font-semibold text-gray-800 mb-4">Are you sure?</h3>

  <div class="mb-6">
    <ul class="space-y-2">
      <li>
        <p><span class="font-semibold text-[#00383F]">Type:</span> {{ data.leave_type }}</p>
      </li>
      <li>
        <p><span class="font-semibold text-[#00383F]">Status:</span> {{ data.status }}</p>
      </li>
      <li>
        <p><span class="font-semibold text-[#00383F]">Details:</span> {{ data.reason }}</p>
      </li>
    </ul>
  </div>

  <div class="flex justify-end space-x-3">
    <button mat-raised-button color="warn" [mat-dialog-close]="1" (click)="confirmDelete()">
      Delete
    </button>
    <button mat-raised-button (click)="onNoClick()" tabindex="-1">
      Cancel
    </button>
  </div>
</div>
