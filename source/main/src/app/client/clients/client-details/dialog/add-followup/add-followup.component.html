<div class="w-full max-w-3xl bg-white rounded-lg shadow-lg">
  <!-- Header -->
  <div class="flex items-center justify-between px-4 py-3 border-b">
    <h2 class="text-lg font-medium text-[#00383F]">Add Follow-up</h2>
    <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form -->
  <div mat-dialog-content class="p-6">
    <form [formGroup]="followupForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Follow-up Date -->
        <mat-form-field class="w-full" appearance="outline">
          <mat-label>Follow-up Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="followup_date" required />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="followupForm.get('followup_date')?.hasError('required')">
            Follow-up Date is required
          </mat-error>
        </mat-form-field>

        <!-- Status -->
        <mat-form-field class="w-full" appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status" required>
            <mat-option value="Hot">Hot</mat-option>
            <mat-option value="Cold">Cold</mat-option>
            <mat-option value="Closed">Closed</mat-option>
          </mat-select>
          <mat-error *ngIf="followupForm.get('status')?.hasError('required')">
            Status is required
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Notes -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Notes</mat-label>
        <textarea matInput formControlName="notes" rows="4"></textarea>
      </mat-form-field>

      <!-- Buttons -->
      <div class="flex justify-end space-x-3 pt-2">
        <!-- <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="followupForm.invalid"
        >
          Add
        </button>
        <button mat-raised-button color="warn" type="button" (click)="onCancel()">
          Cancel
        </button> -->

        <button mat-raised-button color="primary" type="submit" [disabled]="followupForm.invalid || isSubmitting">

          <span *ngIf="!isSubmitting">Add</span>
          <span *ngIf="isSubmitting">Saving...</span>
        </button>


        <button mat-raised-button color="warn" type="button" (click)="onCancel()" [disabled]="isSubmitting"
          tabindex="-1">
          Cancel
        </button>

      </div>
    </form>
  </div>
</div>
