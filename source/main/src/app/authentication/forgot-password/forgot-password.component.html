<section id="mainsection" class="w-full min-h-screen bg-white flex justify-center items-center bg-top p-5"
  style="background-image: url('https://eliteinfotec.in/wp-content/uploads/2024/10/bg-2-5.png'); background-size: cover; background-repeat: no-repeat;">

  <!-- Login Section -->
  <div id="loginsection"
    class="sm:w-[50%] md:w-[50%] lg:w-[50%] bg-[#F2F6F9] rounded-lg p-5 md:p-10 flex flex-col items-center shadow-xl">

    <!-- Logo -->
    <div class="mb-5 flex justify-center">
      <img
        src="../../../assets/images/Teqto(bg).png"
        alt="Company Logo" class="w-32 sm:w-40 md:w-56 lg:w-72">
    </div>

    <!-- Title -->
    <h6 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#00383F] mb-2 text-center">
      Forgot Password
    </h6>
    <p class="text-sm sm:text-base text-gray-600 mb-6 text-center px-2">
      Enter your registered email address and we’ll send you a reset link.
    </p>

    <!-- Form -->
    <form class="w-full flex flex-col gap-4" [formGroup]="forgotForm" (ngSubmit)="onForgotSubmit()">
      <!-- Email Input -->
      <mat-form-field appearance="outline" class="w-full custom-field">
        <mat-label class="!text-[14px]">Email Address</mat-label>
        <input matInput formControlName="email" required type="email" autocomplete="email">
        <mat-icon matSuffix style="color: #009E9E;">email</mat-icon>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <!-- Submit Button -->
      <div class="text-center">
        <button
          class="role-btn w-full sm:w-[15rem] h-10 md:h-12 !bg-[#009E9E] hover:!bg-[#d6d5ea] !text-white hover:text-[#009E9E] shadow-xl rounded-full cursor-pointer"
          [disabled]="!forgotForm.valid || loadingForgot" type="submit">
          {{ loadingForgot ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </div>
    </form>

    <!-- Back to Login -->
    <div class="w-full text-center mt-6">
      <a routerLink="/authentication/login" class="text-[#009E9E] font-medium hover:underline cursor-pointer">
        Back to Login
      </a>
    </div>
  </div>
</section>
