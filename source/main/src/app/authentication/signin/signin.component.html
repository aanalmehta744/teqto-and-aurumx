<div class="auth-container">
  <div class="row auth-main">
    <div class="col-sm-6 auth-form-section">
      <div class="form-section">
        <div class="auth-wrapper">
          <h4 class="welcome-msg mb-2"> Welcome EliteInfotec</h4>
          <div class="d-flex justify-content-between lbl-alert mb-3">
            <div>
              <button mat-stroked-button color="primary" type="button" (click)="setRole('Admin')">Admin</button>
            </div>
            <div>
              <button mat-stroked-button color="warn" type="button" (click)="setRole('Employee')">Employee</button>
            </div>
            <div>
              <button mat-stroked-button color="accent" type="button" (click)="setRole('BDE')">BDE</button>
            </div>
            <div>
              <button mat-stroked-button color="primary" type="button" (click)="setRole('BA')">BA</button>
            </div>
          </div>

          <h2 class="login-title">Sign in</h2>
          <form class="validate-form" [formGroup]="authForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Username</mat-label>
                  <input matInput formControlName="username" />
                  <mat-icon class="material-icons-outlined color-icon p-3" matSuffix>face</mat-icon>
                  <mat-error *ngIf="authForm.get('username')?.hasError('required')">
                    Username is required
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            <div class="row">
              <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Password</mat-label>
                  <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
                  <mat-icon class="material-icons-outlined pwd-toggle p-3" matSuffix (click)="hide = !hide">
                    {{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                  <mat-error *ngIf="authForm.get('password')?.hasError('required')">
                    Password is required
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-5">
              <!-- <a class="txt1" routerLink="/authentication/forgot-password">Forgot Password?</a> -->
            </div>
            <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div>
            <div class="container-auth-form-btn">
              <div style="text-align:center">
                <button mat-flat-button color="accent" [class.auth-spinner]="loading" [disabled]="loading"
                  class="auth-form-btn" [disabled]="!authForm.valid " type="submit">Login</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
