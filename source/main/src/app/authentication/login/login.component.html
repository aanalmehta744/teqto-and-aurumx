<div class="login_body" [ngClass]="{'login_theme-dark': isDarkTheme}">

  <div class="login_backdrop" aria-hidden="true">
    <span class="login_blob login_blob--teal"></span>
    <span class="login_blob login_blob--violet"></span>
    <span class="login_blob login_blob--sky"></span>
    <span class="login_veil"></span>
  </div>

  <main class="login_main">
    <div class="login_shell">
      <div class="login_card">

        <!-- ============ form side ============ -->
        <section class="login_panel login_panel--form">

         <div class="login_brand">
  <img
    src="../../../assets/images/Company_Log.png"
    alt="Teqto Infotech / AurumX Technologies"
    class="login_brand-mark">
</div>

          <form
            class="login_form"
            [formGroup]="authForm"
            (ngSubmit)="onSubmit()"
            novalidate>

            <fieldset class="login_fieldset">
              <legend class="login_legend">Sign in as</legend>
              <div class="login_roles">
                <label class="login_role">
                  <input class="login_role-input" type="radio" formControlName="role" value="Admin">
                  <span class="login_role-face">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-2.9 8.3-7 10-4.1-1.7-7-5.6-7-10V6l7-3z"/></svg>
                    Admin
                  </span>
                </label>
                <label class="login_role">
                  <input class="login_role-input" type="radio" formControlName="role" value="Employee">
                  <span class="login_role-face">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>
                    Employee
                  </span>
                </label>
              </div>
            </fieldset>

            <div class="login_field">
              <svg class="login_field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
              <input
                class="login_input"
                formControlName="username"
                type="text"
                autocomplete="username"
                placeholder="Work email"
                aria-label="Work email">
            </div>

            <div class="login_field">
              <svg class="login_field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7.5a4 4 0 018 0V10"/></svg>
              <input
                class="login_input"
                formControlName="password"
                [type]="hide ? 'password' : 'text'"
                autocomplete="current-password"
                placeholder="Password"
                aria-label="Password">
              <button
                class="login_eye"
                type="button"
                [attr.aria-pressed]="!hide"
                [attr.aria-label]="hide ? 'Show password' : 'Hide password'"
                (click)="toggleHide()">
                <svg *ngIf="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.4 5.2A9.8 9.8 0 0112 5c5 0 9 4.5 9 7a12 12 0 01-2.4 3.4M6.2 6.7C3.9 8.2 3 10.3 3 12c0 2.5 4 7 9 7a9.6 9.6 0 004-.9"/></svg>
                <svg *ngIf="!hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
              </button>
            </div>

            <div class="login_row">
              <label class="login_check">
                <input type="checkbox">
                Keep me signed in
              </label>
              <a class="login_link" (click)="goToForgot()">Forgot password?</a>
            </div>

            <p class="login_error" *ngIf="error" role="alert">{{ error }}</p>

            <button
              class="login_submit"
              type="submit"
              [disabled]="!authForm.valid || loading">
              {{ loading ? 'Signing in...' : 'Sign in' }}
            </button>
          </form>
        </section>

        <!-- ============ brand side ============ -->
        <section class="login_panel login_panel--brand">
          <h1 class="login_title">{{ loginHeading || defaultTitle }}</h1>
          <p class="login_lede">{{ loginDescription || defaultLede }}</p>

          <!-- click the image itself to swap it (client-side preview only) -->
          <label class="login_media" tabindex="0" title="Click to change image">
            <img
              #mediaImg
              class="login_media-img"
              [src]="mediaImage"
              alt="Workspace preview"
              (load)="onMediaImageLoad(mediaImg)">
            <input
              class="login_media-input"
              type="file"
              accept="image/*"
              (change)="onMediaFileChange($event)">
            <span class="login_media-overlay">
              <span class="login_media-chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 015.5 6h1.7l1.2-2h5.2l1.2 2h1.7A2.5 2.5 0 0119 8.5v8A2.5 2.5 0 0116.5 19h-11A2.5 2.5 0 013 16.5v-8z"/><circle cx="11" cy="12" r="3.2"/></svg>
                <span>{{ mediaDimensions || 'Click to change image' }}</span>
              </span>
            </span>
          </label>

          <p class="login_note">&copy; 2026 Teqto Infotech & Aurum X Technologies. All rights reserved</p>
        </section>

      </div>
    </div>
  </main>

</div>
