<link rel="stylesheet" href="./login-tailwind.scss">

<!-- <section
  id="mainsection"
  class="w-full min-h-screen bg-[#E5E7EB] flex justify-center items-center p-6">
   -->
<section
  id="mainsection"
  class="w-full min-h-screen bg-white flex justify-center items-center py-[30px] px-[125px]">

  <div
    id="loginsection"
    class="w-full max-w-7xl bg-white rounded-[22px] shadow-2xl overflow-hidden grid grid-cols-2 lg:grid-cols-2">

    
    <!-- ================= LEFT PANEL ================= -->

    <div class="flex flex-col justify-center items-center px-8 md:px-16 py-12">

      <!-- Logo -->
      <div class="flex items-center gap-3 mb-12 w-full max-w-md">
        <img
          src="../../../assets/images/Teqto(bg).png"
          alt="Logo"
          class="w-10 h-10 rounded-lg">

        <span class="text-2xl font-semibold text-black">
          Teqto
        </span>
      </div>

      <div class="w-full max-w-md">

        <!-- Heading -->

        <h1 class="text-5xl font-bold text-center text-[#111827]">
          Welcome Back
        </h1>

        <p class="text-center text-gray-400 mt-3 mb-8">
          Please enter your login detailsssssss
        </p>

        <!-- Role Buttons -->

        <div class="grid grid-cols-4 bg-gray-100 rounded-xl p-1 mb-8">

          <button
            type="button"
            (click)="setRole('Admin')"
            class="py-2 rounded-lg text-sm font-medium transition-all"
            [ngClass]="selectedRole==='Admin'
            ? 'bg-white shadow text-black'
            : 'text-gray-500'">
            Admin
          </button>

          <button
            type="button"
            (click)="setRole('Employee')"
            class="py-2 rounded-lg text-sm font-medium transition-all"
            [ngClass]="selectedRole==='Employee'
            ? 'bg-white shadow text-black'
            : 'text-gray-500'">
            Employee
          </button>

          <button
            type="button"
            (click)="setRole('BDE')"
            class="py-2 rounded-lg text-sm font-medium transition-all"
            [ngClass]="selectedRole==='BDE'
            ? 'bg-white shadow text-black'
            : 'text-gray-500'">
            BDE
          </button>

          <button
            type="button"
            (click)="setRole('BA')"
            class="py-2 rounded-lg text-sm font-medium transition-all"
            [ngClass]="selectedRole==='BA'
            ? 'bg-white shadow text-black'
            : 'text-gray-500'">
            BA
          </button>

        </div>

        <!-- FORM -->

        <form
          [formGroup]="authForm"
          (ngSubmit)="onSubmit()"
          class="space-y-5">

          <!-- Username -->

          <mat-form-field appearance="outline" class="w-full">

            <mat-label>Username</mat-label>

            <input
              matInput
              formControlName="username">

            <mat-icon matSuffix>person</mat-icon>

            <mat-error
              *ngIf="authForm.get('username')?.hasError('required')">
              Username is required
            </mat-error>

          </mat-form-field>

          <!-- Password -->

          <mat-form-field appearance="outline" class="w-full">

            <mat-label>Password</mat-label>

            <input
              matInput
              [type]="hide ? 'password':'text'"
              formControlName="password">

            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="toggleHide()">

              <mat-icon>
                {{hide ? 'visibility_off' : 'visibility'}}
              </mat-icon>

            </button>

            <mat-error
              *ngIf="authForm.get('password')?.hasError('required')">

              Password is required

            </mat-error>

          </mat-form-field>

          <!-- Error -->

          <div
            *ngIf="error"
            class="text-center text-red-500">

            {{error}}

          </div>

          <!-- Button -->

          <button
            type="submit"
            [disabled]="!authForm.valid || loading"
            class="w-full h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition">

            {{loading ? 'Logging in...' : 'Continue'}}

          </button>

        </form>

        <!-- Forgot Password -->

        <div class="text-center mt-6">

          <a
            (click)="goToForgot()"
            class="text-gray-500 hover:underline cursor-pointer">

            Forgot Password?

          </a>

        </div>

      </div>

    </div>

    <!-- ================= RIGHT PANEL ================= -->

    <div
      class="hidden lg:flex flex-col justify-center items-center bg-[#F8FAFC] border-l border-gray-100 gap-6 py-10">

      <div class="w-[75%]">

        <img
          [src]="loginImage || defaultImage"
          alt="Login Illustration"
          class="w-full object-contain rounded-xl">

      </div>

      <div *ngIf="loginHeading || loginDescription" class="w-[75%] text-left">
        <h2 *ngIf="loginHeading" class="text-xl font-bold text-gray-800 mb-1">
          {{ loginHeading }}
        </h2>
        <p *ngIf="loginDescription" class="text-sm text-gray-500 leading-relaxed">
          {{ loginDescription }}
        </p>
      </div>

    </div>

  </div>

</section>
