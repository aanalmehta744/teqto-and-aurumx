<link rel="stylesheet" href="./login-tailwind.scss">
<section id="mainsection"
    class="w-full min-h-screen bg-[#00383F] flex justify-center items-center bg-repeat-x bg-top p-5 "
    style="background-image: url('https://eliteinfotec.in/wp-content/uploads/2024/10/bg-2-5.png');">

    <!-- Login Section -->
    <div id="loginsection"
        class="w-[95%] md:w-[80%] bg-[#F2F6F9] rounded-lg grid grid-cols-1 xl:grid-cols-2 p-5 md:p-10">

        <!-- Left Section -->
        <div id="clip-logo"
            class="w-full h-full pt-5 sm:mt-0 flex flex-col justify-evenly items-center rounded-2xl bg-[#d5eaea] bg-[url('https://eliteinfotec.in/wp-content/uploads/2024/10/bg-2-5.png')] ">

            <div class="w-full h-auto text-center">
                <div class="w-full h-auto flex justify-center items-center">
                    <img 
                            src="../../../assets/images/teqto_infotech_logo.png"

                        alt="Logoooooooo" class="w-40 md:w-50 lg:w-[18rem]" />
                </div>
            </div>

            <div class="w-full h-auto flex flex-col justify-center items-center mt-2 p-5 md:p-7">

                <div id="icondiv"
                    class="w-[10rem] h-[10rem] sm:w-[15rem] sm:h-[15rem] md:w-[18rem] md:h-[18rem]  bg-[#F2F6F9] relative shadow-xl">

                    <div class="orbit-container">

                        <div class="orbit-item" style="--i:0">
                            <div class="w-auto h-auto rounded-full bg-white p-2 md:p-3 shadow-2xl">
                                <img src="../../../assets/login/user.png" alt="Calendar"
                                    class="w-8 h-8 md:w-9 md:h-9" />
                            </div>
                        </div>


                        <div class="orbit-item" style="--i:1">
                            <div class="w-auto h-auto rounded-full bg-white p-2 md:p-3.5 shadow-2xl">
                                <img src="../../../assets/login/holidays.png" alt="Software Engineer"
                                    class="w-10 h-10 md:w-10 md:h-10" />
                            </div>
                        </div>


                        <div class="orbit-item" style="--i:2">
                            <div class="w-auto h-auto rounded-full bg-white p-2 md:p-2.5 shadow-2xl">
                                <img src="../../../assets/login/employee (1).png" alt="Employees"
                                    class="w-10 h-10 md:w-12 md:h-12" />
                            </div>
                        </div>


                        <div class="orbit-item" style="--i:3">
                            <div class="w-auto h-auto rounded-full bg-white p-2 md:p-3.5 shadow-2xl">
                                <img src="../../../assets/login/verification.png" alt="Verification"
                                    class="w-8 h-8 md:w-10 md:h-10" />
                            </div>
                        </div>
                    </div>

                    <img src="../../../assets/login/administrator.png" alt="Chronometer"
                        class="absolute top-1/2 left-1/2 w-8 h-8 md:w-12 md:h-12 -translate-x-1/2 -translate-y-1/2" />

                </div>
            </div>

        </div>

        <!-- Right Section -->
        <div class="w-full h-full py-4 md:py-5 px-4 md:px-10 flex flex-col justify-between items-center">

            <div class="w-full h-auto flex flex-col sm:flex-row justify-between gap-2 md:gap-4 my-4 md:my-6">
                <!-- Admin -->
                <button class="py-3 px-6 rounded-full shadow-xl role-btn" [ngClass]="{
    '!bg-[#009E9E] !text-white': selectedRole !== 'Admin',
    '!bg-[#D5EAEA] !text-[#009E9E]': selectedRole === 'Admin'
  }" (click)="setRole('Admin')">
                    Admin
                </button>

                <!-- Employee -->
                <button class="py-3 px-6 rounded-full shadow-xl role-btn" [ngClass]="{
    '!bg-[#009E9E] !text-white': selectedRole !== 'Employee',
    '!bg-[#D5EAEA] !text-[#009E9E]': selectedRole === 'Employee'
  }" (click)="setRole('Employee')">
                    Employee
                </button>

                <!-- BDE -->
                <button class="py-3 px-6 rounded-full shadow-xl role-btn" [ngClass]="{
    '!bg-[#009E9E] !text-white': selectedRole !== 'BDE',
    '!bg-[#D5EAEA] !text-[#009E9E]': selectedRole === 'BDE'
  }" (click)="setRole('BDE')">
                    BDE
                </button>

                 <button class="py-3 px-6 rounded-full shadow-xl role-btn" [ngClass]="{
    '!bg-[#009E9E] !text-white': selectedRole !== 'BA',
    '!bg-[#D5EAEA] !text-[#009E9E]': selectedRole === 'BA'
  }" (click)="setRole('BA')">
                    BA
                </button>

            </div>

            <!-- Form -->
            <form class="w-full h-auto flex flex-col gap-3 md:gap-5 sm:py-5 sm:px-5" [formGroup]="authForm"
                (ngSubmit)="onSubmit()">
                <!-- Username -->
                <div class="w-full">
                    <mat-form-field appearance="fill" class="w-full custom-field">
                        <mat-label class="!text-[14px]">Enter your username</mat-label>
                        <input matInput formControlName="username" required>
                        <mat-icon matSuffix style="color: #009E9E;">person</mat-icon>
                        <mat-error *ngIf="authForm.get('username')?.hasError('required')">
                            Username is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <!-- Password -->
                <div class="w-full mt-4">
                    <mat-form-field appearance="fill" class="w-full custom-field">
                        <mat-label class="!text-[14px]">Enter your password</mat-label>
                        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" required>
                        <button mat-icon-button matSuffix (click)="toggleHide()" type="button">
                            <mat-icon style="color: #009E9E;">{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>

                        <mat-error *ngIf="authForm.get('password')?.hasError('required')">
                            Password is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <!-- Error Message -->
                <div *ngIf="error" class="text-red-500 mt-2 text-center">{{ error }}</div>

                <!-- Submit Button -->
                <div class="w-full h-auto flex justify-center items-center mt-2 md:mt-4">
                    <button
                        class="w-full sm:w-[15rem] h-10 md:h-12 !bg-[#009E9E] hover:!bg-[#D5EAEA] !text-white !hover:text-[#009E9E] shadow-xl rounded-full cursor-pointer role-btn"
                        [disabled]="!authForm.valid || loading" [class.opacity-50]="loading" type="submit">
                        {{ loading ? 'Logging in...' : 'Login' }}
                    </button>
                </div>
            </form>
            <!-- Forgot Password -->
            <div class="text-right mt-1">
                <a (click)="goToForgot()" style="color: #009E9E; font-weight:500;"
                    class="text-sm hover:underline cursor-pointer">
                    Forgot Password?
                </a>
            </div>
        </div>

    </div>

</section>
