<section id="mainsection" class="w-full min-h-screen bg-white flex justify-center items-center bg-top p-5"
    style="background-image: url('https://eliteinfotec.in/wp-content/uploads/2024/10/bg-2-5.png'); background-size: cover; background-repeat: no-repeat;">

    <div id="loginsection"
        class="w-full sm:w-[90%] md:w-[70%] lg:w-[50%] bg-[#F2F6F9] rounded-lg p-5 md:p-10 flex flex-col items-center shadow-xl">

        <!-- Logo -->
        <div class="mb-5 flex justify-center">
            <img 
        src="../../../assets/images/Teqto(bg).png"

            alt="Company Logo" class="w-28 sm:w-36 md:w-48 lg:w-72">
        </div>

        <!-- Title -->
        <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#00383F] mb-2 text-center">
            Reset Your Password
        </h2>
        <p class="text-sm sm:text-base text-gray-600 mb-6 text-center px-2">
            Enter a new password below to secure your account.
        </p>

        <!-- Reset Form -->
        <form class="w-full flex flex-col gap-4" [formGroup]="resetForm" (ngSubmit)="onResetSubmit()">

            <!-- Email -->
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Email Address</mat-label>
                <input matInput formControlName="email" type="email" [disabled]="true">
                <mat-icon matSuffix style="color: #009E9E;">email</mat-icon>
            </mat-form-field>

            <!-- New Password -->
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>New Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
                <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
                    <mat-icon style="color: #009E9E;">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="resetForm.get('password')?.hasError('required')">
                    Password is required
                </mat-error>
                <mat-error *ngIf="resetForm.get('password')?.hasError('minlength')">
                    Password must be at least 6 characters
                </mat-error>
            </mat-form-field>

            <!-- Confirm Password -->
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Confirm Password</mat-label>
                <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="conformPassword">
                <button mat-icon-button matSuffix type="button" (click)="toggleConfirm()">
                    <mat-icon style="color: #009E9E;">{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="resetForm.get('conformPassword')?.hasError('required')">
                    Confirm password is required
                </mat-error>
                <mat-error
                    *ngIf="resetForm.get('conformPassword')?.hasError('mismatch') && resetForm.get('conformPassword')?.touched">
                    Passwords do not match
                </mat-error>
            </mat-form-field>

            <!-- Submit Button -->
            <div class="text-center">
                <button
                    class="role-btn w-full sm:w-[15rem] h-10 md:h-12 !bg-[#009E9E] hover:!bg-[#d6d5ea] !text-white hover:text-[#009E9E] shadow-xl rounded-full cursor-pointer"
                    [disabled]="!resetForm.valid || loadingReset" type="submit">
                    {{ loadingReset ? 'Updating...' : 'Reset Password' }}
                </button>
            </div>
        </form>

        <!-- Back to Login -->
        <div class="w-full text-center mt-6">
            <a routerLink="/authentication/login" class="text-[#009E9E] font-medium hover:underline cursor-pointer">
                Back to Login
            </a>
        </div>
    </div>
</section>
