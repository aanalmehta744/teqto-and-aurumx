<div class="p-5 w-full max-w-2xl">

  <div class="flex items-center justify-between mb-5">

    <div>
      <h2 class="text-xl font-semibold text-[#1B1B2F]">
        Pause History
      </h2>

      <p
        *ngIf="data.employeeName"
        class="text-sm text-gray-500 mt-1"
      >
        {{ data.employeeName }}
      </p>
    </div>

  </div>

  <div
    *ngIf="!data.history || data.history.length === 0"
    class="text-center py-10 text-gray-400"
  >
    No pause history found.
  </div>

  <div
    *ngIf="data.history?.length"
    class="space-y-3 max-h-[500px] overflow-y-auto"
  >

    <div
      *ngFor="let pause of data.history; let i = index"
      class="border border-gray-200 rounded-xl p-4 bg-gray-50"
    >

      <div class="flex justify-between items-center mb-3">

        <span class="font-semibold text-[#1B1B2F]">
          Pause #{{ i + 1 }}
        </span>

        <span
          class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full"
        >
          {{ pause.duration || '--' }}
        </span>

      </div>

      <div class="grid grid-cols-2 gap-4">

        <div>
          <p class="text-xs text-gray-400">
            Pause Start
          </p>

          <p class="text-sm font-medium text-gray-700">
            {{ formatTime(pause.pause_start) }}
          </p>
        </div>

        <div>
          <p class="text-xs text-gray-400">
            Resume
          </p>

          <p class="text-sm font-medium text-gray-700">
            {{ formatTime(pause.pause_end) }}
          </p>
        </div>

      </div>

    </div>

  </div>

</div>
