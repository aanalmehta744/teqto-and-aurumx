<div class="mb-4">

  <!-- ── Add Announcement button (admin / HR only) ── -->
  <div *ngIf="canManage && !showForm" class="flex justify-end mb-3">
    <button (click)="showForm = true"
      class="flex items-center gap-2 bg-[#312e81] hover:bg-[#3730a3] text-white text-sm px-4 py-2 rounded-lg transition-colors shadow">
      <mat-icon class="!text-sm !h-4 !w-4">campaign</mat-icon>
      Add Announcement
    </button>
  </div>

  <!-- ── Post Announcement Form (admin / HR only) ── -->
  <div *ngIf="showForm" class="bg-white rounded-xl shadow-lg border border-indigo-100 p-5 mb-4">
    <h3 class="text-base font-semibold text-[#312e81] mb-4 flex items-center gap-2">
      <mat-icon class="!text-base">campaign</mat-icon> New Announcement
    </h3>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Left: text fields -->
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium text-gray-600 block mb-1">Title <span class="text-gray-400">(optional)</span></label>
          <input type="text" [(ngModel)]="newTitle" placeholder="e.g. Office Closed on Monday"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="text-xs font-medium text-gray-600 block mb-1">Message <span class="text-red-400">*</span></label>
          <textarea [(ngModel)]="newText" rows="5" placeholder="Write your announcement here..."
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-300"></textarea>
        </div>
      </div>
      <!-- Right: image upload -->
      <div>
        <label class="text-xs font-medium text-gray-600 block mb-1">Image <span class="text-gray-400">(optional)</span></label>
        <label
          class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-indigo-200 rounded-xl cursor-pointer hover:bg-indigo-50 transition overflow-hidden">
          <img *ngIf="previewUrl" [src]="previewUrl" class="w-full h-full object-cover rounded-xl" alt="preview" />
          <div *ngIf="!previewUrl" class="text-center p-4">
            <mat-icon class="text-indigo-300 !text-4xl">add_photo_alternate</mat-icon>
            <p class="text-xs text-gray-400 mt-1">Click to upload image</p>
            <p class="text-xs text-gray-300">PNG, JPG up to 5 MB</p>
          </div>
          <input type="file" accept="image/*" class="hidden" (change)="onFileChange($event)" />
        </label>
        <button *ngIf="previewUrl" (click)="selectedFile = null; previewUrl = null"
          class="mt-1 text-xs text-red-400 hover:underline">Remove image</button>
      </div>
    </div>
    <div class="flex gap-2 mt-4 justify-end">
      <button (click)="cancelForm()"
        class="px-4 py-2 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50">Cancel</button>
      <button (click)="submitAnnouncement()" [disabled]="!newText.trim() || submitting"
        class="px-5 py-2 text-sm rounded-lg bg-[#312e81] text-white hover:bg-[#3730a3] disabled:opacity-50 transition">
        {{ submitting ? 'Posting...' : 'Post Announcement' }}
      </button>
    </div>
  </div>

  <!-- ── Announcement Cards ── -->
  <div *ngFor="let ann of announcements" class="bg-white rounded-xl shadow border border-gray-100 mb-3 overflow-hidden">
    <div class="flex flex-col md:flex-row">

      <!-- Left: Text content -->
      <div class="flex-1 px-5 py-4">
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2 mb-2">
            <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-[#312e81]">
              <mat-icon class="!text-sm text-white !h-4 !w-4">campaign</mat-icon>
            </span>
            <span class="text-xs font-semibold text-[#312e81] uppercase tracking-wider">Announcement</span>
          </div>
          <!-- Delete button (admin/HR only) -->
          <button *ngIf="canManage" (click)="deleteAnnouncement(ann.id)" matTooltip="Delete"
            class="text-gray-300 hover:text-red-400 transition flex-shrink-0">
            <mat-icon class="!text-base">delete_outline</mat-icon>
          </button>
        </div>
        <h4 *ngIf="ann.title" class="text-gray-800 font-semibold text-base mb-1">{{ ann.title }}</h4>
        <p class="text-gray-600 text-sm leading-relaxed whitespace-pre-line">{{ ann.text }}</p>
        <p class="text-xs text-gray-300 mt-3">
          Posted by {{ ann.created_by_name || 'Admin' }} &nbsp;·&nbsp;
          {{ ann.created_at | date:'dd MMM yyyy, h:mm a' }}
        </p>
      </div>

      <!-- Right: Image -->
      <div *ngIf="ann.image_path" class="md:w-56 lg:w-64 flex-shrink-0">
        <img [src]="imageUrl(ann.image_path)" alt="announcement"
          class="w-full h-48 md:h-full object-cover" />
      </div>

    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="announcements.length === 0 && !showForm" class="hidden"></div>

</div>
