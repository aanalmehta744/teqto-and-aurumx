<section class="w-full">
    <div class="mx-auto">
        <!-- Breadcrumb -->
        <div>
            <app-breadcrumb [title]="'Daily Updates'" [items]="['Home']"
                [active_item]="'Daily Updates'"></app-breadcrumb>
        </div>

        <!-- Card Container -->
        <div class="w-full">
            <div class="bg-white rounded-lg shadow-xl">

                <!-- Header: Title + Search + Buttons -->
                <div
                    class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 p-4 border-b bg-[#00C4C4] rounded-t-lg">
                    <!-- Left Side -->
                    <div class="flex flex-wrap items-center gap-4">
                        <h2 class="text-lg text-white">Daily Updates</h2>
                        <div class="flex items-center justify-center">
                            <div
                                class="border border-[#CCCCCC] rounded-full bg-white flex items-center text-gray-500 shadow w-full max-w-md">
                                <mat-icon class="ms-3">search</mat-icon>
                                <input id="search-input" placeholder="Search" type="text" #filter
                                    (keyup)="applyFilter(filter.value)"
                                    class="w-full h-[40px] rounded-full ps-2 focus:outline-none placeholder:text-[17px]" />
                            </div>
                        </div>
                    </div>

                    <!-- Right Side Buttons -->
                    <div class="flex items-center gap-2">
                        <button mat-mini-fab class="!bg-[#D5EAEA] hover:!bg-gray-100 !text-[#00383F]" matTooltip="ADD"
                            (click)="addNew()">
                            <mat-icon>add</mat-icon>
                        </button>
                        <button mat-mini-fab class="!bg-[#D5EAEA] hover:!bg-gray-100 !text-[#00383F]"
                            matTooltip="REFRESH" (click)="refresh()">
                            <mat-icon>refresh</mat-icon>
                        </button>
                    </div>
                </div>

                <!-- Table Section -->
                <div>
                    <ng-scrollbar class="max-h-[70vh]">
                        <div class="p-4">
                            <!-- No Results -->
                            <div *ngIf="!isTblLoading && filteredGroupedData.length === 0"
                                class="text-center py-4 text-gray-500">
                                No results
                            </div>

                            <!-- Grouped Tables -->
                            <div *ngFor="let group of filteredGroupedData" class="mb-6">
                                <!-- Group Date Header -->
                                <h6 class="text-lg font-medium text-[#009F9F] mb-2">
                                    {{ group.date | date: "MMM d, y '('EEE')'" }}
                                </h6>

                                <!-- Table -->
                                <table mat-table [dataSource]="group.dataSource" matSort
                                    class="w-full border rounded text-sm table-auto overflow-x-auto">
                                    <!-- Project -->
                                    <ng-container matColumnDef="project">
                                        <mat-header-cell *matHeaderCellDef
                                            class="bg-gray-100 p-2 font-semibold">Project</mat-header-cell>
                                        <mat-cell *matCellDef="let row" class="p-2">{{ row.projectTitle ||
                                            row.trainer_project_name || '-'
                                            }}</mat-cell>
                                    </ng-container>

                                    <!-- Task Title -->
                                    <ng-container matColumnDef="taskTitle">
                                        <mat-header-cell *matHeaderCellDef class="bg-gray-100 p-2 font-semibold">Task
                                            Title</mat-header-cell>
                                        <mat-cell *matCellDef="let row" class="p-2">{{ row.title || '-' }}</mat-cell>
                                    </ng-container>
                                    <!-- Task Details -->
                                    <ng-container matColumnDef="taskDetails">
                                        <mat-header-cell *matHeaderCellDef class="bg-gray-100 p-2 font-semibold">
                                            Task Details
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let row" class="p-2">
                                            <div class="flex flex-col h-full justify-between min-h-[4rem] pt-1">

                                                <!-- Scrollable Content -->
                                                <div [ngClass]="{
          'line-clamp-2': !expandedTaskDetails[row.id] && row.note?.length > 100
        }" class="transition-all ease-in-out duration-300 whitespace-pre-wrap break-words max-h-32 overflow-y-auto pr-2"
                                                    [innerHTML]="row.note || '-'">
                                                </div>

                                                <!-- More/Less Button -->
                                                <div *ngIf="row.note?.length > 100" class="mt-2 text-right">
                                                    <button (click)="toggleTaskDetails(row.id)"
                                                        class="text-blue-600 hover:underline text-xs">
                                                        {{ expandedTaskDetails[row.id] ? 'Less' : 'More' }}
                                                    </button>
                                                </div>
                                            </div>
                                        </mat-cell>
                                    </ng-container>


                                    <!-- Update Details -->
                                    <ng-container matColumnDef="update">
                                        <mat-header-cell *matHeaderCellDef class="bg-gray-100 p-2 font-semibold">
                                            Update
                                        </mat-header-cell>
                                        <mat-cell *matCellDef="let row" class="p-2">
                                            <div class="flex flex-col h-full justify-between min-h-[4rem] pt-1">

                                                <!-- Scrollable Content -->
                                                <div [ngClass]="{
          'line-clamp-2': !expandedRows[row.id] && row.update_details?.length > 100
        }" class="transition-all ease-in-out duration-300 whitespace-pre-wrap break-words max-h-32 overflow-y-auto pr-2"
                                                    [innerHTML]="row.update_details || '-'">
                                                </div>

                                                <!-- More/Less Button -->
                                                <div *ngIf="row.update_details?.length > 100" class="mt-2 text-right">
                                                    <button (click)="toggleExpand(row.id)"
                                                        class="text-blue-600 hover:underline text-xs">
                                                        {{ expandedRows[row.id] ? 'Less' : 'More' }}
                                                    </button>
                                                </div>
                                            </div>
                                        </mat-cell>
                                    </ng-container>

                                    <!-- Status -->
                                    <ng-container matColumnDef="status">
                                        <mat-header-cell *matHeaderCellDef
                                            class="bg-gray-100 p-2 font-semibold">Status</mat-header-cell>
                                        <mat-cell *matCellDef="let row" class="p-2">{{ row.status || '-' }}</mat-cell>
                                    </ng-container>

                                    <!-- Actions -->
                                    <ng-container matColumnDef="actions">
                                        <mat-header-cell *matHeaderCellDef
                                            class="bg-gray-100 p-2 font-semibold text-right">Actions</mat-header-cell>
                                        <mat-cell *matCellDef="let row" class="p-2 text-right space-x-2">
                                            <button mat-icon-button color="accent"
                                                (click)="$event.stopPropagation(); editCall(row)" matTooltip="Edit">
                                                <app-feather-icons [icon]="'edit'"
                                                    [class]="'tbl-fav-edit'"></app-feather-icons>
                                            </button>
                                            <button mat-icon-button color="warn"
                                                (click)="$event.stopPropagation(); deleteItem(row)" matTooltip="Delete">
                                                <app-feather-icons [icon]="'trash-2'"
                                                    [class]="'tbl-fav-delete'"></app-feather-icons>
                                            </button>
                                            <!-- View Button -->
                                            <button mat-icon-button color="primary"
                                                (click)="$event.stopPropagation(); detailsCall(row)" matTooltip="View">
                                                <app-feather-icons [icon]="'eye'"
                                                    [class]="'tbl-fav-view'"></app-feather-icons>
                                            </button>
                                        </mat-cell>
                                    </ng-container>

                                    <!-- Rows -->
                                    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                                    <mat-row *matRowDef="let row; columns: displayedColumns"
                                        class="hover:bg-gray-50 cursor-pointer"></mat-row>
                                </table>

                                <!-- Paginator -->
                                <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>

                                <hr class="my-4 border-gray-300" />
                            </div>
                        </div>
                    </ng-scrollbar>
                </div>
            </div>
        </div>
    </div>
</section>
