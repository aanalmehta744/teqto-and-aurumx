<section>
  <div class="max-h-[80vh] overflow-auto bg-white rounded-xl shadow-xl">
    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-4 border-b">
      <h2 class="text-xl font-medium text-[#00383F]">{{ dialogTitle }}</h2>
      <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Scrollable Form -->
    <div class="p-6">
      <form [formGroup]="candidatesForm" (ngSubmit)="submit()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Form Fields -->
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="full_name" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Mobile</mat-label>
            <input matInput type="tel" formControlName="mobile" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>LinkedIn</mat-label>
            <input matInput formControlName="linkedin" />
          </mat-form-field>



          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Gender</mat-label>
            <mat-select formControlName="gender" required>
              <mat-option value="Male">Male</mat-option>
              <mat-option value="Female">Female</mat-option>
              <mat-option value="Other">Other</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Experience</mat-label>
            <input matInput formControlName="experience" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Last Company</mat-label>
            <input matInput formControlName="last_company" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Last CTC</mat-label>
            <input matInput formControlName="last_ctc" />
          </mat-form-field>

          <!-- Resume -->
          <div class="w-full">
            <label class="block mb-1 text-sm font-medium text-gray-700" for="resume-upload">Resume</label>
            <input id="resume-upload" type="file" (change)="onFileSelected($event)" class="block w-full text-sm" />
            <div *ngIf="selectedResumeFileName" class="mt-1 text-sm text-gray-600">{{ selectedResumeFileName }}</div>
          </div>
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Address</mat-label>
            <textarea matInput rows="2" formControlName="address"></textarea>
          </mat-form-field>

          <!-- Job -->
          <mat-form-field appearance="outline" class="w-full col-span-full">
            <mat-label>Job</mat-label>
            <mat-select formControlName="job_id">
              <mat-option *ngFor="let job of jobs" [value]="job.id">{{ job.title }}</mat-option>
            </mat-select>
          </mat-form-field>

          <!-- Status -->
          <mat-form-field appearance="outline" class="w-full col-span-full">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status" required>
              <mat-option value="New">New</mat-option>
              <mat-option value="Screening">Screening</mat-option>
              <mat-option value="Interviewing">Interviewing</mat-option>
              <mat-option value="Offered">Offered</mat-option>
              <mat-option value="Hired">Hired</mat-option>
              <mat-option value="Rejected">Rejected</mat-option>
              <mat-option value="Backout">Backout</mat-option>
            </mat-select>
          </mat-form-field>

          <!-- Remarks -->
          <mat-form-field appearance="outline" class="w-full col-span-full">
            <mat-label>Remarks</mat-label>
            <textarea matInput rows="3" formControlName="remarks"></textarea>
          </mat-form-field>

        </div>

        <!-- Buttons -->
        <div class="pt-4 text-right">
          <button mat-raised-button color="primary" type="submit" [disabled]="!candidatesForm.valid" class="mr-2">
            Save
          </button>
          <button mat-raised-button color="warn" type="button" (click)="onNoClick()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</section>
