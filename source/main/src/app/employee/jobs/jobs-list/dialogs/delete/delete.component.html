
<div class="p-4 rounded-lg w-full max-w-md mx-auto">
  <h3 class="text-lg font-medium text-gray-800 mb-4">Are you sure?</h3>

  <div class="space-y-2 text-sm text-gray-700 mb-4">
    <p><span class="font-semibold text-[#00383f]">Job Title:</span> {{ data.title }}</p>
    <p><span class="font-semibold text-[#00383f]">Department:</span> {{ data.department }}</p>
    <p><span class="font-semibold text-[#00383f]">Vacancies:</span> {{ data.vacancies }}</p>
  </div>

  <div class="flex items-center justify-end gap-3 pt-4">
    <button
      mat-raised-button
      color="warn"
      [mat-dialog-close]="1"
      (click)="confirmDelete()"
    >
      Delete
    </button>
    <button
      mat-raised-button
      (click)="onNoClick()"
      tabindex="-1"
    >
      Cancel
    </button>
  </div>
</div>
