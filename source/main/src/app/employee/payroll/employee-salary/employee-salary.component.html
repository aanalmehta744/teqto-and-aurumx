<section>
  <div class="mx-auto">
    <div>
      <app-breadcrumb [title]="'Employee Salary'" [items]="['Payroll']" [active_item]="'Employee Salary'">
      </app-breadcrumb>
    </div>

    <div class="flex flex-wrap">
      <div class="w-full">
        <div class="rounded-lg shadow-xl overflow-hidden">

          <!-- table-header -->
          <div class="flex flex-col md:flex-row justify-between items-center p-4 border-b bg-[#00c4c4]">
            <div class="w-full md:w-auto mb-4 md:mb-0">
              <div class="flex flex-col md:flex-row items-start md:items-center gap-4">
                <h2 class="text-lg text-white">Employee Salary</h2>
                <div class="flex items-center justify-center">
                  <div
                    class="border border-[#CCCCCC] rounded-full bg-white flex items-center text-gray-500 shadow w-full max-w-md">
                    <mat-icon class="ms-3">search</mat-icon>
                    <input type="text"
                      class="w-full h-[40px] rounded-full ps-2 focus:outline-none placeholder:text-[16px]"
                      placeholder="Search" matInput #filter (keyup)="applyFilter($event)" id="inputoutline">
                  </div>
                </div>
              </div>
            </div>

            <div class="w-full md:w-auto">
              <ul class="flex items-center md:justify-end gap-2">
                <li>
                  <div class="ml-2" matTooltip="REFRESH">
                    <button mat-mini-fab class="!bg-[#D5EAEA] hover:!bg-gray-100" (click)="refresh()">
                      <mat-icon class="!text-[#00383F]">refresh</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="ml-2" [hidden]="!selection.hasValue()" matTooltip="DELETE">
                    <button mat-mini-fab color="warn" class="!bg-[#D5EAEA] hover:!bg-gray-100"
                      (click)="removeSelectedRows()">
                      <mat-icon class="!text-[#00383F]">delete</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="cursor-pointer p-2 rounded-xl bg-[#D5EAEA] hover:bg-gray-100 shadow-xl" matTooltip="XLSX"
                    (click)="exportExcel()">
                    <img src="assets/images/icons/xlsx.png" alt="Export to XLSX" class="w-6 h-6" />
                  </div>
                </li>
              </ul>
            </div>
          </div>

          <!-- table-body -->
          <div class="overflow-auto">
            <div class="min-w-full">
              <table mat-table [dataSource]="dataSource" matSort class="w-full">

                <ng-container matColumnDef="id">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Id</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{row.id}}</mat-cell>
                </ng-container>

                <ng-container matColumnDef="name">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <!-- <span class="md:hidden font-medium mr-2">Name:</span> -->
                    {{row.fullName}}
                  </mat-cell>
                </ng-container>

                <ng-container matColumnDef="email">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Email</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)"
                    class="whitespace-nowrap min-w-[150px]">
                    <!-- <span class="md:hidden font-medium mr-2">Email:</span> -->
                    {{row.email}}
                  </mat-cell>
                </ng-container>

                <ng-container matColumnDef="department">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Department</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <!-- <span class="md:hidden font-medium mr-2">Department:</span> -->
                    {{row.department}}
                  </mat-cell>
                </ng-container>

                <ng-container matColumnDef="role">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Role</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <!-- <span class="md:hidden font-medium mr-2">Role:</span> -->
                    {{row.role}}
                  </mat-cell>
                </ng-container>

                <ng-container matColumnDef="salary">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Salary</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <!-- <span class="md:hidden font-medium mr-2">Salary:</span> -->
                    {{row.salary}}
                  </mat-cell>
                </ng-container>

                <ng-container matColumnDef="payslip">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Payslip</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <!-- <span class="md:hidden font-medium mr-2">Payslip:</span> -->

                    <!-- Download Button -->
                    <button mat-icon-button color="accent" class="tbl-action-btn"
                      (click)="$event.stopPropagation(); downloadCall(row)">
                      <app-feather-icons [icon]="'download'" [class]="'col-green'"
                        matTooltip="Download"></app-feather-icons>
                    </button>

                    <!-- Add Payslip Manually Button -->
                    <!-- <button mat-icon-button color="primary" class="tbl-action-btn"
                      (click)="$event.stopPropagation(); openPayslipForm(row)">
                      <app-feather-icons [icon]="'plus-circle'" [class]="'col-blue'"
                        matTooltip="Add Payslip Manually"></app-feather-icons>
                    </button> -->
                  </mat-cell>
                </ng-container>


                <ng-container matColumnDef="actions">
                  <mat-header-cell *matHeaderCellDef class="pr-0">Actions</mat-header-cell>
                  <mat-cell *matCellDef="let row; let i=index;" class="pr-0 flex items-center gap-1">
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation(); editCall(row)"
                      class="tbl-action-btn" matTooltip="Edit">
                      <app-feather-icons [icon]="'edit'" [class]="'tbl-fav-edit'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="warn" (click)="$event.stopPropagation(); deleteItem(i, row)"
                      class="tbl-action-btn" matTooltip="Delete">
                      <app-feather-icons [icon]="'trash-2'" [class]="'tbl-fav-delete'"></app-feather-icons>
                    </button>
                  </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" class="cursor-pointer hover:bg-gray-50"
                  matRipple></mat-row>
              </table>

              @if (exampleDatabase?.isTblLoading) {
              <div class="flex justify-center items-center py-8">
                <mat-progress-spinner color="primary" [diameter]="40" mode="indeterminate">
                </mat-progress-spinner>
              </div>
              }

              <div class="invisible fixed" [style.left]="contextMenuPosition.x" [style.top]="contextMenuPosition.y"
                [matMenuTriggerFor]="contextMenu">
              </div>
              <mat-menu #contextMenu="matMenu">
                <ng-template matMenuContent let-item="item">
                  <button mat-menu-item (click)="editCall(item)">
                    <mat-icon>create</mat-icon>
                    <span>Edit Record</span>
                  </button>
                  <button mat-menu-item (click)="deleteItem(item.id, item)">
                    <mat-icon>delete</mat-icon>
                    <span>Delete Record</span>
                  </button>
                  <button mat-menu-item (click)="refresh()">
                    <mat-icon>refresh</mat-icon>
                    <span>Refresh Record</span>
                  </button>
                  <button mat-menu-item disabled>
                    <mat-icon>no_encryption</mat-icon>
                    <span>Disable</span>
                  </button>
                  <button mat-menu-item [matMenuTriggerFor]="nestedmenu">
                    <mat-icon>list_alt</mat-icon>
                    <span> Nested Menu</span>
                  </button>
                </ng-template>
              </mat-menu>
              <mat-menu #nestedmenu="matMenu">
                <button mat-menu-item>
                  <mat-icon>mail_outline</mat-icon>
                  <span>Item 1</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>call</mat-icon>
                  <span>Item 2</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>chat</mat-icon>
                  <span>Item 3</span>
                </button>
              </mat-menu>

              @if (!exampleDatabase?.isTblLoading) {
              <div class="py-8 text-center text-gray-500" [class.hidden]="dataSource.renderedData.length !== 0">
                No results found
              </div>
              }

            </div>
          </div>

          <mat-paginator #paginator [length]="dataSource.filteredData.length" [pageIndex]="0" [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]" class="!p-2 !border-t !bg-[#FAF9FD]">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
