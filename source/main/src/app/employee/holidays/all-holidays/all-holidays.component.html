<section>
  <div class="mx-auto">
    <div class="mb-4">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'All Holiday'" [items]="['Holidays']" [active_item]="'All Holiday'"></app-breadcrumb>
    </div>
    <div class="flex flex-wrap">
      <div class="w-full">
        <div class="!bg-[#d6d5ea] rounded-lg shadow-xl overflow-hidden">
          <!-- Table Header -->
          <div class="flex flex-col md:flex-row justify-between items-center p-4 border-b bg-[#0b0b88]">
            <div class="w-full md:w-auto mb-4 md:mb-0">
              <ul class="flex flex-col md:flex-row items-start md:items-center gap-4">
                <li>
                  <h2 class="text-lg text-white mr-2">Holidays</h2>
                </li>
                <div class="flex items-center justify-center">
                  <div
                    class="border border-[#CCCCCC] rounded-full bg-white flex items-center text-gray-500 shadow w-full max-w-md">
                    <mat-icon class="ms-3">search</mat-icon>
                    <input placeholder="Search" type="text" #filter (keyup)="applyFilter($event)"
                      class="w-full h-[40px] rounded-full ps-2 focus:outline-none placeholder:text-[16px]"
                      aria-label="Search box">
                  </div>
                </div>
              </ul>
            </div>
            <div class="w-full md:w-auto">
              <ul class="flex items-center md:justify-end gap-2">
                <li>
                  <div class="ml-2" matTooltip="ADD">
                    <button mat-mini-fab class="!bg-[#d6d5ea] hover:!bg-gray-100" (click)="addNew()">
                      <mat-icon class="!text-[#00383F]">add</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="ml-2" matTooltip="REFRESH">
                    <button mat-mini-fab class="!bg-[#d6d5ea] hover:!bg-gray-100" (click)="refresh()">
                      <mat-icon class="!text-[#00383F]">refresh</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="ml-2" [hidden]=!selection.hasValue() matTooltip="DELETE">
                    <button mat-mini-fab class="!bg-[#d6d5ea] hover:!bg-gray-100" (click)="removeSelectedRows()">
                      <mat-icon class="!text-[#00383F]">delete</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="cursor-pointer p-2 rounded-xl bg-[#d6d5ea] hover:bg-gray-100 shadow-xl" matTooltip="XLSX">
                    <img src="assets/images/icons/xlsx.png" alt="Export to Excel" class="w-6 h-6"
                      (click)="exportExcel()" />
                  </div>
                </li>
              </ul>
            </div>
          </div>

          <!-- Table Content -->
          <div class="overflow-x-auto">
            <div class="min-w-full">
              <table mat-table [dataSource]="dataSource" matSort class="w-full mat-cell !bg-[#ffffff]">

                <!-- SELECT Column -->
                <ng-container matColumnDef="select">
                  <mat-header-cell *matHeaderCellDef class="w-[7%]">
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()">
                    </mat-checkbox>
                  </mat-header-cell>

                  <mat-cell *matCellDef="let row" class="w-[7%]">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)">
                    </mat-checkbox>
                  </mat-cell>
                </ng-container>

                <!-- ID Column -->
                <ng-container matColumnDef="id">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Id</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.id }}</mat-cell>
                </ng-container>

                <!-- Holiday Name -->
                <ng-container matColumnDef="hName">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Holiday Name</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.hName }}</mat-cell>
                </ng-container>

                <!-- Date -->
                <ng-container matColumnDef="date">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Date</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.date | date }}</mat-cell>
                </ng-container>

                <!-- Details -->
                <ng-container matColumnDef="details">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Details</mat-header-cell>
                  <mat-cell *matCellDef="let row">
                    <span class="truncate block max-w-[200px]" [attr.title]="row.details">{{ row.details }}</span>
                  </mat-cell>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                  <mat-header-cell *matHeaderCellDef class="pr-0 whitespace-nowrap">Actions</mat-header-cell>

                  <mat-cell *matCellDef="let row; let i=index;" class="pr-0 flex items-center space-x-1">
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation(); editCall(row)"
                      matTooltip="Edit">
                      <app-feather-icons icon="edit" class="tbl-fav-edit"></app-feather-icons>
                    </button>

                    <button mat-icon-button color="warn" (click)="$event.stopPropagation(); deleteItem(i, row)"
                      matTooltip="Delete">
                      <app-feather-icons icon="trash-2" class="tbl-fav-delete"></app-feather-icons>
                    </button>
                  </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="editCall(row)"
                  class="cursor-pointer hover:bg-gray-50">
                </mat-row>
              </table>

              <!-- No Results -->
              <div class="text-center py-8 text-gray-500"
                *ngIf="!exampleDatabase?.isTblLoading && dataSource.renderedData.length === 0">
                No results found
              </div>


            </div>
          </div>
          <!-- Pagination -->
          <mat-paginator [length]="dataSource.filteredData.length" [pageIndex]="0" [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]" class="!border-t !p-2">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
