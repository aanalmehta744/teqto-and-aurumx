<section>
  <app-breadcrumb [title]="'KPI Targets'" [items]="['Admin','KPI']" [active_item]="'KPI Targets'"></app-breadcrumb>

  <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
    <h2 class="text-lg font-semibold text-gray-700">BDE KPI Targets</h2>
    <div class="flex gap-2 items-center">
      <select [(ngModel)]="filterBdeId" (change)="loadTargets()" class="border rounded px-3 py-2 text-sm">
        <option value="">All BDEs</option>
        <option *ngFor="let b of bdes" [value]="b.id">{{ b.fullName }}</option>
      </select>
      <button mat-raised-button color="primary" (click)="openAdd()">+ Set Target</button>
    </div>
  </div>


  <!-- Form -->
  <div *ngIf="showForm" class="bg-white rounded-xl shadow p-6 mb-6">
    <h3 class="text-md font-semibold mb-4 text-gray-700">{{ editMode ? 'Edit Target' : 'Set KPI Target' }}</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1">BDE *</label>
      <select
  [(ngModel)]="form.user_id"
  class="w-full border rounded px-3 py-2 text-sm text-red-500">
  <option value="">-- Select BDE --</option>
  <option *ngFor="let b of bdes" [value]="b.id">
    {{ b.fullName }}
  </option>
</select>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">KPI *</label>
        <select [(ngModel)]="form.kpi_id" class="w-full border rounded px-3 py-2 text-sm  text-red-500">
          <option value="">-- Select KPI --</option>
          <option *ngFor="let k of kpis" [value]="k.kpi_id">{{ k.kpi_name }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Target Value *</label>
        <input [(ngModel)]="form.target_value" type="number" class="w-full border rounded px-3 py-2 text-sm  text-red-500" placeholder="e.g. 50"  />
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Month *</label>
        <select [(ngModel)]="form.month" class="w-full border rounded px-3 py-2 text-sm  text-red-500">
          <option *ngFor="let m of months" [value]="m.v">{{ m.l }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Year *</label>
        <input [(ngModel)]="form.year" type="number" class="w-full border rounded px-3 py-2 text-sm  text-red-500" placeholder="2025"   />
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Weightage (%)</label>
        <input [(ngModel)]="form.weightage" type="number" class="w-full border rounded px-3 py-2 text-sm text-red-500" placeholder="Optional" />
      </div>
    </div>
    <div class="flex gap-3 mt-4">
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="submitting">
        {{ submitting ? 'Saving...' : (editMode ? 'Update' : 'Set Target') }}
      </button>
      <button mat-stroked-button (click)="cancel()">Cancel</button>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table mat-table [dataSource]="targets" class="w-full text-sm">
      <ng-container matColumnDef="bde_name">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">BDE</th>
        <td mat-cell *matCellDef="let t" class="p-3">{{ t.bde_name }}</td>
      </ng-container>
      <ng-container matColumnDef="kpi_name">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">KPI</th>
        <td mat-cell *matCellDef="let t" class="p-3">{{ t.kpi_name }}</td>
      </ng-container>
      <ng-container matColumnDef="target_value">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">Target</th>
        <td mat-cell *matCellDef="let t" class="p-3">{{ t.target_value }} {{ t.unit }}</td>
      </ng-container>
      <ng-container matColumnDef="month">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">Month</th>
        <td mat-cell *matCellDef="let t" class="p-3">{{ monthName(t.month) }}</td>
      </ng-container>
      <ng-container matColumnDef="year">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">Year</th>
        <td mat-cell *matCellDef="let t" class="p-3">{{ t.year }}</td>
      </ng-container>
      <ng-container matColumnDef="weightage">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">Weightage</th>
        <td mat-cell *matCellDef="let t" class="p-3">{{ t.weightage || '--' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="bg-gray-100 p-3 font-semibold">Actions</th>
        <td mat-cell *matCellDef="let t" class="p-3">
          <button mat-icon-button color="primary" (click)="openEdit(t)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="delete(t.target_id)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50"></tr>
      <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="p-6 text-center text-gray-400">No targets set yet</td>
      </tr>
    </table>
  </div>
</section>
