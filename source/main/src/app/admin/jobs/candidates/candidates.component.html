<section>
  <div class="mx-auto">
    <div>
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Candidates'" [items]="['Jobs']" [active_item]="'Candidates'"></app-breadcrumb>
    </div>
    <div class="flex flex-wrap">
      <div class="w-full">
        <div class="!bg-[#D5EAEA] rounded-lg shadow-xl overflow-hidden">

          <!-- Header -->
          <div class="flex flex-col md:flex-row justify-between items-center p-4 border-b bg-[#00c4c4]">
            <div class="w-full md:w-auto mb-4 md:mb-0">
              <ul class="flex flex-col md:flex-row items-start md:items-center gap-4">
                <li>
                  <h2 class="text-lg text-white">Candidates</h2>
                </li>
                <div class="flex items-center">
                  <div
                    class="border border-gray-300 bg-white rounded-full shadow flex items-center text-gray-500 w-full max-w-md">
                    <mat-icon class="ms-3">search</mat-icon>
                    <input placeholder="Search" type="text" #filter (keyup)="applyFilter($event)"
                      class="w-full h-[40px] rounded-full ps-2 focus:outline-none placeholder:text-[16px]"
                      aria-label="Search box">
                  </div>
                </div>
              </ul>
            </div>

            <div class="w-full md:w-auto">
              <ul class="flex items-center justify-end gap-2">
                <!-- <li>
                  <div matTooltip="ADD">
                    <button mat-mini-fab class="!bg-[#D5EAEA] hover:!bg-gray-100" (click)="addNew()">
                      <mat-icon class="!text-[#00383F]">add</mat-icon>
                    </button>
                  </div>
                </li> -->
                <li>
                  <div matTooltip="REFRESH">
                    <button mat-mini-fab class="!bg-[#D5EAEA] hover:!bg-gray-100" (click)="refresh()">
                      <mat-icon class="!text-[#00383F]">refresh</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div [hidden]="!selection.hasValue()" matTooltip="DELETE">
                    <button mat-mini-fab class="!bg-[#D5EAEA] hover:!bg-gray-100" (click)="removeSelectedRows()">
                      <mat-icon class="!text-[#00383F]">delete</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="cursor-pointer p-2 rounded-xl bg-[#D5EAEA] hover:bg-gray-100 shadow-xl" matTooltip="XLSX">
                    <img src="assets/images/icons/xlsx.png" alt="Export to Excel" class="w-6 h-6"
                      (click)="exportExcel()" />
                  </div>
                </li>
              </ul>
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-auto">
            <div class="min-w-full">
              <table mat-table [dataSource]="dataSource" matSort class="w-full">

                <ng-container matColumnDef="id">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Id</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{row.id}}</mat-cell>
                </ng-container>

                <ng-container matColumnDef="name">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <span class="truncate-text"> {{row.full_name}}</span></mat-cell>
                </ng-container>
                <ng-container matColumnDef="email">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Email</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <span class="truncate-text"> {{row.email}}</span>
                  </mat-cell>
                </ng-container>
                <ng-container matColumnDef="mobile">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Mobile</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <span class="truncate-text"> {{row.mobile}}</span>
                  </mat-cell>
                </ng-container>
                <ng-container matColumnDef="linkedin">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Linkedin</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)"
                    matTooltip={{row.linkedin}}>
                    <span class="truncate-text"> {{row.linkedin}}</span>
                  </mat-cell>
                </ng-container>
                <ng-container matColumnDef="experience">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Experience</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <span class="truncate-text"> {{row.experience}}</span>
                  </mat-cell>
                </ng-container>
                <ng-container matColumnDef="last_company">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Last Company
                  </mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    <span class="truncate-text">{{row.last_company}}</span>
                  </mat-cell>
                </ng-container>
                <ng-container matColumnDef="download">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Download</mat-header-cell>
                  <mat-cell *matCellDef="let row" (contextmenu)="onContextMenu($event, row)">
                    
                    <a [href]="'http://localhost:3000/uploads/resumes/' + row.resume" download
                      (click)="$event.stopPropagation()" target="_blank" rel="noopener noreferrer">
                      <button mat-icon-button color="accent" class="tbl-action-btn" matTooltip="Download Resume">
                        <app-feather-icons [icon]="'download'" [class]="'col-green'"></app-feather-icons>
                      </button>
                    </a>
                  </mat-cell>
                </ng-container>
                <ng-container matColumnDef="actions">
                  <mat-header-cell class="pr-0" *matHeaderCellDef>Actions</mat-header-cell>
                  <mat-cell *matCellDef="let row; let i=index;" class="pr-0 w-[500px] md:w-auto">
                    <button mat-icon-button color="primary" (click)="$event.stopPropagation(); viewDetails(row)"
                      class="tbl-action-btn" matTooltip="View Details">
                      <app-feather-icons [icon]="'eye'" [class]="'tbl-fav-view'"></app-feather-icons>
                    </button>
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()" (click)="editCall(row)"
                      class="tbl-action-btn" matTooltip="Edit">
                      <app-feather-icons [icon]="'edit'" [class]="'tbl-fav-edit'">
                      </app-feather-icons>
                    </button>
                    <button mat-icon-button color="accent" (click)="$event.stopPropagation()"
                      (click)="deleteItem(i, row)" class="tbl-action-btn" matTooltip="Delete">
                      <app-feather-icons [icon]="'trash-2'" [class]="'tbl-fav-delete'">
                      </app-feather-icons>
                    </button>
                  </mat-cell>
                </ng-container>
                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="editCall(row)"
                  class="cursor-pointer hover:bg-gray-50" matRipple>
                </mat-row>
              </table>
              <!-- No Results -->
              @if (!exampleDatabase?.isTblLoading) {
              <div class="py-8 text-center text-gray-500" [class.hidden]="dataSource.renderedData.length !== 0">
                No results
              </div>
              }


            </div>
          </div>
          <!-- Pagination -->
          <mat-paginator #paginator [length]="dataSource.filteredData.length" [pageIndex]="0" [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]" class="!border-t !p-2 !bg-[#FAF9FD] !w-full">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
