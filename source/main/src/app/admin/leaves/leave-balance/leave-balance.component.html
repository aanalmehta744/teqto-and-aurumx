<section>
  <div class="mx-auto">
    <div class="mb-4">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Leave Balance'" [items]="['Leaves']" [active_item]="'Leave Balance'"></app-breadcrumb>
    </div>
    <div class="flex flex-wrap">
      <div class="w-full">
        <div class="rounded-lg shadow-xl overflow-hidden">

          <!-- Table Header -->
          <div class="flex flex-col md:flex-row justify-between items-center p-4 border-b !bg-[#00c4c4]">
            <div class="w-full md:w-auto mb-4 md:mb-0">
              <ul class="flex flex-col md:flex-row items-start md:items-center gap-4">
                <li>
                  <h2 class="text-lg text-white mr-2">Leave Balance</h2>
                </li>
                <div class="flex items-center justify-center">
                  <div
                    class="border border-[#CCCCCC] rounded-full bg-white flex items-center text-gray-500 shadow w-full max-w-md">
                    <mat-icon class="ms-3">search</mat-icon>
                    <input type="text" #filter
                      class="w-full h-[40px] rounded-full ps-2 focus:outline-none placeholder:text-[16px]"
                      placeholder="Search" (keyup)="applyFilter($event)" matInput id="inputoutline">
                  </div>
                </div>
              </ul>
            </div>
          </div>

          <!-- Table Body -->
          <div class="overflow-auto">
            <div class="min-w-full">
              <table mat-table [dataSource]="dataSource" matSort
                class="min-w-full border-collapse text-sm md:text-base">

                <!-- ID -->
                <ng-container matColumnDef="id">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Id</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.id }}</mat-cell>
                </ng-container>

                <!-- Name -->
                <ng-container matColumnDef="name">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.fullName }}</mat-cell>
                </ng-container>

                <!-- Total -->
                <ng-container matColumnDef="total">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Total</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.total }}</mat-cell>
                </ng-container>

                <!-- Current Balance -->
                <ng-container matColumnDef="current_balance">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Current
                    Balance</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.current_balance }}</mat-cell>
                </ng-container>

                <!-- Used -->
                <ng-container matColumnDef="used_balance">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Used
                    Balance</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.used_balance }}</mat-cell>
                </ng-container>

                <!-- Remaining -->
                <ng-container matColumnDef="remaining_paid_leave">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Remaining</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.remaining_paid_leave }}</mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" class="cursor-pointer hover:bg-gray-50"
                  matRipple>
                </mat-row>

              </table>

              <!-- No results -->
              <div class="py-4 text-center text-gray-500"
                *ngIf="!exampleDatabase?.isTblLoading && dataSource.filteredData.length === 0">
                No results found
              </div>

            </div>
          </div>
          <mat-paginator #paginator [length]="dataSource.filteredData.length" [pageIndex]="0" [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]" class="!border-t !p-2 !bg-[#FAF9FD]">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
