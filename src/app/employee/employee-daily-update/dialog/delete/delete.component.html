
<h3 mat-dialog-title class="text-xl font-semibold text-[#00383F] mb-2">
  Are you sure?
</h3>

<div mat-dialog-content class="mb-4">
  <ul class="space-y-2">
    <li>
      <p>
        <span class="font-semibold text-[#00383F]">Task Title:</span>
        {{ data.title }}
      </p>
    </li>
    <li>
      <p>
        <span class="font-semibold text-[#00383F]">Date:</span>
        {{ data.update_date | date }}
      </p>
    </li>
    <li>
      <p>
        <span class="font-semibold text-[#00383F]">Project Title:</span>
        {{ data.projectTitle }}
      </p>
    </li>
  </ul>
</div>

<div mat-dialog-actions class="flex justify-end gap-2">
  <button mat-raised-button color="warn" [mat-dialog-close]="1" (click)="confirmDelete()">
    Delete
  </button>
  <button mat-raised-button (click)="onNoClick()" tabindex="-1">
    Cancel
  </button>
