<nav class="w-full h-16 bg-white/95 backdrop-blur-md sticky top-0 z-50 px-4 grid grid-cols-2 border-b border-indigo-100 shadow-[0_2px_12px_-4px_rgba(79,70,229,0.15)]">

  <!-- LEFT: 3-line toggle first, then logo always visible and aligned -->
  <div class="flex items-center justify-start h-full ">

    <!-- Desktop sidebar toggle — 3 lines. Only on laptop/PC; mobile uses the bottom nav. -->
    <button mat-icon-button (click)="toggleSidebar.emit()"
      class="!hidden lg:!flex shrink-0 !text-indigo-600 hover:!bg-indigo-50 !rounded-xl transition-colors" aria-label="Toggle Sidebar">
      <app-feather-icons icon="menu" class="header-icon text-indigo-600"></app-feather-icons>
    </button>

    <!-- Logo always visible after the 3 lines, aligned to header height -->
    <a [routerLink]="homePage" class="flex items-center shrink-0 h-full">
      <img [src]="getLogUrl()" alt="logo"
        class="object-contain h-full w-auto max-w-[10rem]" />
    </a>
  </div>

  <!-- RIGHT: notifications + profile avatar -->
  <div class="flex items-center justify-end space-x-3 h-full" [ngClass]="isNavbarCollapsed ? '' : 'show'">

    <!-- Notification bell -->
    <div *ngIf="userRole === 'Admin' || userRole === 'Employee'" class="relative">
      <button (click)="toggleNotifPanel()"
        class="relative p-2 rounded-xl text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
        <mat-icon class="text-indigo-600">notifications</mat-icon>
        <span *ngIf="notifCount > 0"
          class="absolute -top-0.5 -right-0.5 bg-gradient-to-br from-rose-500 to-red-600 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center leading-none ring-2 ring-white">
          {{ notifCount > 9 ? '9+' : notifCount }}
        </span>
      </button>

      <!-- Backdrop -->
      <div *ngIf="showNotifPanel" class="fixed inset-0 z-40" (click)="showNotifPanel = false"></div>

      <!-- Notification dropdown -->
      <div *ngIf="showNotifPanel"
        class="absolute right-0 top-12 w-80 bg-white shadow-2xl rounded-2xl z-50 border border-indigo-100 overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white px-4 py-3 flex justify-between items-center">
          <span class="text-sm font-semibold">Notifications</span>
          <button (click)="markAllRead()" class="text-xs text-indigo-100 underline hover:text-white">Mark all read</button>
        </div>
        <div class="max-h-72 overflow-y-auto">
          <div *ngFor="let n of notifications"
            (click)="markRead(n)"
            class="px-4 py-3 border-b border-gray-100 text-sm hover:bg-indigo-50/50 cursor-pointer transition-colors"
            [class.bg-indigo-50]="!n.is_read">
            <p class="text-gray-800 leading-snug">{{ n.message }}</p>
            <p class="text-xs text-indigo-400 mt-1">{{ n.created_at | date:'MMM d, y, h:mm a' }}</p>
          </div>
          <div *ngIf="notifications.length === 0" class="p-5 text-center text-gray-400 text-sm">
            No new notifications
          </div>
        </div>
      </div>
    </div>

    <!-- Profile avatar button — opens dropdown -->
    <button matButton [matMenuTriggerFor]="profileMenu"
      class="!p-0 !min-w-0 !rounded-full ring-2 ring-indigo-200 hover:ring-indigo-400 hover:ring-offset-1 transition-all">
      <img [src]="getProfileImgUrl()" alt="Profile"
           class="w-9 h-9 rounded-full object-cover" />
    </button>

    <!-- Profile dropdown -->
    <mat-menu #profileMenu="matMenu" class="!p-0">

      <!-- Profile card with gradient banner -->
      <div class="flex items-center gap-3 px-4 py-4 bg-gradient-to-r from-indigo-600 to-blue-500 text-white cursor-pointer min-w-[240px]"
           (click)="goToProfile(); $event.stopPropagation()">
        <img [src]="getProfileImgUrl()" alt="Profile"
             class="w-11 h-11 rounded-full object-cover shrink-0 ring-2 ring-white/70" />
        <div class="min-w-0">
          <div class="text-sm font-semibold truncate">{{ userName }}</div>
          <div class="text-xs text-indigo-100 truncate">{{ userRole }}</div>
        </div>
      </div>
      <!-- View profile -->
      <button mat-menu-item (click)="goToProfile()" class="!text-indigo-700 !text-[13px]">
        <app-feather-icons icon="user" class="user-menu-icons mr-1 align-top"></app-feather-icons>
        My Profile
      </button>
      <!-- Logout -->
      <button mat-menu-item (click)="logout()" class="!text-rose-600 !text-[13px]">
        <app-feather-icons icon="log-out" class="user-menu-icons mr-1 align-top"></app-feather-icons>
        Logout
      </button>
    </mat-menu>

  </div>
</nav>
