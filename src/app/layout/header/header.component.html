<nav class="w-full h-16 bg-[white] sticky top-0 z-50 px-4 grid grid-cols-2 shadow-sm">

  <!-- LEFT: 3-line toggle first, then logo always visible and aligned -->
  <div class="flex items-center justify-start h-full ">

    <!-- Desktop sidebar toggle — 3 lines. Only on laptop/PC; mobile uses the bottom nav. -->
    <button mat-icon-button (click)="toggleSidebar.emit()" class="!hidden lg:!flex shrink-0" aria-label="Toggle Sidebar">
      <app-feather-icons icon="menu" class="header-icon text-[#00383F]"></app-feather-icons>
    </button>

    <!-- Logo always visible after the 3 lines, aligned to header height -->
    <a [routerLink]="homePage" class="flex items-center shrink-0 h-full">
      <img [src]="getLogUrl()" alt="logo"
        class="object-contain h-full w-auto max-w-[10rem]" />
    </a>
  </div>

  <!-- RIGHT: notifications + profile avatar -->
  <div class="flex items-center justify-end space-x-3 h-full" [ngClass]="isNavbarCollapsed ? '' : 'show'">

    <!-- Notification bell -->
    <div *ngIf="userRole === 'Admin' || userRole === 'Employee'" class="relative">
      <button (click)="toggleNotifPanel()" class="relative p-2 text-gray-600 hover:text-indigo-600 transition-colors">
        <mat-icon class="text-[#00383F]">notifications</mat-icon>
        <span *ngIf="notifCount > 0"
          class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center leading-none">
          {{ notifCount > 9 ? '9+' : notifCount }}
        </span>
      </button>

      <!-- Backdrop -->
      <div *ngIf="showNotifPanel" class="fixed inset-0 z-40" (click)="showNotifPanel = false"></div>

      <!-- Notification dropdown -->
      <div *ngIf="showNotifPanel"
        class="absolute right-0 top-12 w-80 bg-white shadow-2xl rounded-xl z-50 border border-gray-100 overflow-hidden">
        <div class="bg-white text-gray-800 border-b border-gray-100 px-4 py-2.5 flex justify-between items-center">
          <span class="text-sm font-semibold">Notifications</span>
          <button (click)="markAllRead()" class="text-xs text-gray-500 underline hover:text-gray-800">Mark all read</button>
        </div>
        <div class="max-h-72 overflow-y-auto">
          <div *ngFor="let n of notifications"
            (click)="markRead(n)"
            class="px-4 py-3 border-b border-gray-100 text-sm hover:bg-gray-50 cursor-pointer"
            [class.bg-indigo-50]="!n.is_read">
            <p class="text-gray-800 leading-snug">{{ n.message }}</p>
            <p class="text-xs text-gray-400 mt-1">{{ n.created_at | date:'MMM d, y, h:mm a' }}</p>
          </div>
          <div *ngIf="notifications.length === 0" class="p-5 text-center text-gray-400 text-sm">
            No new notifications
          </div>
        </div>
      </div>
    </div>

    <!-- Profile avatar button — opens dropdown (like Image #4) -->
    <button matButton [matMenuTriggerFor]="profileMenu"
      class="!p-0 !min-w-0 !rounded-full !border-2 !border-indigo-200 hover:!border-indigo-400 transition-all">
      <img [src]="getProfileImgUrl()" alt="Profile"
           class="w-9 h-9 rounded-full object-cover" />
    </button>

    <!-- Profile dropdown -->
    <mat-menu #profileMenu="matMenu" class="!p-0">
      <!-- Company logo -->
      <div class="flex justify-center items-center px-4 py-3 border-b border-gray-100 bg-gray-50 min-w-[220px]"
           (click)="$event.stopPropagation()">
        <img src="/assets/images/imagecopy.img" alt="Logo" class="h-8 max-w-[140px] object-contain" />
      </div>
      <!-- Profile card -->
      <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer"
           (click)="goToProfile(); $event.stopPropagation()">
        <img [src]="getProfileImgUrl()" alt="Profile"
             class="w-10 h-10 rounded-full object-cover shrink-0 ring-2 ring-indigo-100" />
        <div class="min-w-0">
          <div class="text-sm font-semibold text-gray-800 truncate">{{ userName }}</div>
          <div class="text-xs text-gray-400 truncate">{{ userRole }}</div>
        </div>
      </div>
      <!-- Logout -->
      <button mat-menu-item (click)="logout()" class="!text-[#00383f] !text-[13px]">
        <app-feather-icons icon="log-out" class="user-menu-icons mr-1 align-top"></app-feather-icons>
        Logout
      </button>
    </mat-menu>

  </div>
</nav>
