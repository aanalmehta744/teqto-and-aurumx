<div class="w-full h-[100vh] flex flex-col">
  <app-header
    [collapsed]="isSidebarCollapsed"
    [isHovered]="isHovered"
    (toggleSidebar)="toggleSidebar()"
    (mobileSidebarToggle)="isMobileOpen = !isMobileOpen"
  ></app-header>

  <div class="w-full flex-1 min-h-0 flex items-start">
    <app-sidebar
      [collapsed]="!isMobile && isSidebarCollapsed"
      [isHovered]="isHovered"
      (closeSidebarAfterNavigation)="isMobileOpen = false"
      class="h-full shrink-0 transition-all duration-300"
      [ngClass]="{
        'w-[4.5rem]': !isMobile && isSidebarCollapsed && !isHovered,
        'w-[20rem]': !isMobile && (!isSidebarCollapsed || isHovered),
        'w-0 overflow-visible': isMobile,
      }"
    >
    </app-sidebar>

    <div
      [dir]="direction"
      id="main-content"
      class="hr-page-enter h-full flex-1 min-w-0 overflow-auto hide-scrollbar py-4 px-3 md:px-4 rounded-tr-2xl transition-all duration-300"
      [style.padding-bottom]="
        isMobile ? 'calc(4rem + env(safe-area-inset-bottom) + 1rem)' : null
      "
    >
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
