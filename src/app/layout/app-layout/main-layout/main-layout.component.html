<div class="w-full h-[100vh]">
  <app-header [collapsed]="isSidebarCollapsed" [isHovered]="isHovered" (toggleSidebar)="toggleSidebar()"
    (mobileSidebarToggle)="isMobileOpen = !isMobileOpen"></app-header>

  <div class="w-full h-[92.2%] 3xl:h-[96%] flex items-start">

    <!-- Sidebar: ONLY on laptop/PC (>=1024px). Fixed rem width so it looks consistent
         on every screen size. On mobile it collapses to 0 and the bottom nav takes over. -->
    <app-sidebar
      [collapsed]="!isMobile && isSidebarCollapsed"
      [isHovered]="isHovered"
      (closeSidebarAfterNavigation)="isMobileOpen = false"
      class="h-full shrink-0 transition-all duration-300"
      [ngClass]="{
        'w-[4.5rem]': !isMobile && isSidebarCollapsed && !isHovered,
        'w-[16rem]': !isMobile && (!isSidebarCollapsed || isHovered),
        'w-0 overflow-visible': isMobile
      }">
    </app-sidebar>

    <!-- Main content: flex-1 fills whatever space is left beside the sidebar,
         so it adapts to any width. pb clears the fixed bottom nav on mobile. -->
    <div [dir]="direction"
      id="main-content"
      class="h-full flex-1 min-w-0 overflow-auto hide-scrollbar py-4 px-3 md:px-4 rounded-tl-2xl transition-all duration-300"
      [style.padding-bottom]="isMobile ? 'calc(4rem + env(safe-area-inset-bottom) + 1rem)' : null">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
