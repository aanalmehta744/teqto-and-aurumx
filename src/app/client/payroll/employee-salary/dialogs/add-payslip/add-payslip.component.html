<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix"></div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <div mat-dialog-content>
        <h2 mat-dialog-title class="text-lg font-semibold">
            Add Payslip Manually
        </h2>

        <mat-dialog-content class="mt-2 space-y-4">

            <!-- Show employee name -->
            <p *ngIf="data?.fullName" class="text-sm text-gray-700">
                Employee: <strong>{{ data.fullName }}</strong>
            </p>

            <!-- Month Selector -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Select Month</mat-label>
                <mat-select [(value)]="selectedMonth">
                    <mat-option *ngFor="let month of months" [value]="month.value">
                        {{ month.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <!-- Year Input -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Select Year</mat-label>
                <input matInput type="number" [(ngModel)]="selectedYear" />
            </mat-form-field>

            <!-- Present Days -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Present Days</mat-label>
                <input matInput type="number" [(ngModel)]="presentDays" />
            </mat-form-field>

            <!-- Paid Leave Days -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Paid Leave Days</mat-label>
                <input matInput type="number" [(ngModel)]="paidLeaveDays" />
            </mat-form-field>

            <!-- Unpaid Leave Days -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Unpaid Leave Days</mat-label>
                <input matInput type="number" [(ngModel)]="unpaidLeaveDays" />
            </mat-form-field>

            <!-- Weekend Days -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Weekend Days</mat-label>
                <input matInput type="number" [(ngModel)]="weekendDays" />
            </mat-form-field>

            <!-- Working Days -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Total Working Days</mat-label>
                <input matInput type="number" [(ngModel)]="workingDays" />
            </mat-form-field>

            <!-- Net Salary -->
            <mat-form-field class="w-full" appearance="outline">
                <mat-label>Net Salary</mat-label>
                <input matInput type="number" [(ngModel)]="netSalary" />
            </mat-form-field>

        </mat-dialog-content>

        <!-- Actions -->
        <div mat-dialog-actions align="end" class="pt-4 space-x-2">
            <button mat-flat-button (click)="dialogRef.close()">Cancel</button>
            <button mat-flat-button color="primary" (click)="onSave()">Save Payslip</button>
        </div>
    </div>
</div>
