
<div class="bg-white rounded-lg shadow-xl w-full max-w-3xl mx-auto">
  <!-- Modal Header -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 rounded-t-lg">
    <h2 class="text-lg font-medium text-[#00383F]">Daily Update</h2>
    <button mat-icon-button (click)="dialogRef.close()" aria-label="Close dialog" class="text-white">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Modal Body -->
  <div mat-dialog-content class="p-6">
    <form [formGroup]="dailyUpdateForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <input type="hidden" formControlName="employee_id" />

      <!-- Non-HR Fields -->
      <div *ngIf="!isHrDepartment()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Project Dropdown -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Project</mat-label>
          <mat-select formControlName="project_id" required>
            <mat-option *ngFor="let project of projects" [value]="project.id">
              {{ project.projectTitle }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="dailyUpdateForm.get('project_id')?.hasError('required')">
            Project is required
          </mat-error>
        </mat-form-field>

        <!-- Task Dropdown -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Task</mat-label>
          <mat-select formControlName="task_id">
            <mat-option
              *ngFor="let task of tasks"
              [value]="task.id"
              [ngClass]="{
                'highlight-today': isToday(task.due_date),
                'light-task': !isToday(task.due_date)
              }"
            >
              {{ task.title }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Task Status (Full Width) -->
        <mat-form-field appearance="outline" class="w-full col-span-1 md:col-span-2">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status" required>
            <mat-option value="Not Started">Not Started</mat-option>
            <mat-option value="In Progress">In Progress</mat-option>
            <mat-option value="Completed">Completed</mat-option>
            <mat-option value="Pending">Pending</mat-option>
            <mat-option value="Error / Issue">Error / Issue</mat-option>
            <mat-option value="Cancelled">Cancelled</mat-option>
          </mat-select>
          <mat-error *ngIf="dailyUpdateForm.get('status')?.hasError('required')">
            Status is required
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Date Picker -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="update_date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="dailyUpdateForm.get('update_date')?.hasError('required')">
          Please select a date
        </mat-error>
      </mat-form-field>

      <!-- Update Textarea -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Update</mat-label>
        <textarea matInput rows="4" formControlName="update_details" required></textarea>
        <mat-error *ngIf="dailyUpdateForm.get('update_details')?.hasError('required')">
          Update details are required
        </mat-error>
      </mat-form-field>

      <!-- Actions -->
      <div class="flex justify-end gap-4 pt-2">
        <button
          mat-raised-button
          color="primary"
          [disabled]="!dailyUpdateForm.valid"
        >
          Save
        </button>
        <button mat-raised-button color="warn" type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
