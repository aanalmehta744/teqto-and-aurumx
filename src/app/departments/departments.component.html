<section>
  <div class="mx-auto">
    <div class="mb-4"><app-breadcrumb [title]="'Departments'" [items]="['Settings']" [active_item]="'Departments'"></app-breadcrumb></div>
    <div class="bg-white rounded-lg shadow-xl p-6">
      <div *ngIf="canManage" class="flex flex-col md:flex-row md:items-end gap-3 mb-6">
        <mat-form-field appearance="outline" class="w-full md:w-2/3">
          <mat-label>New Department</mat-label>
          <input matInput [(ngModel)]="newDepartment" (keyup.enter)="add()" placeholder="e.g. Shopify">
        </mat-form-field>
        <button mat-raised-button color="primary" class="h-[56px]" (click)="add()" [disabled]="!newDepartment.trim()"><mat-icon>add</mat-icon> Add Department</button>
      </div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold text-[#00383F]">Departments</h2>
        <span class="text-sm text-gray-500">{{ departments.length }} total</span>
      </div>
      <div *ngIf="!departments.length" class="py-10 text-center text-gray-500">No departments found.</div>
      <div *ngFor="let dept of departments" class="flex items-center justify-between border rounded-lg px-4 py-3 mb-2">
        <div class="font-medium text-gray-800">{{ dept.name }}</div>
        <button *ngIf="canManage" mat-icon-button color="warn" (click)="remove(dept)" matTooltip="Delete department"><mat-icon>delete</mat-icon></button>
      </div>
    </div>
  </div>
</section>
