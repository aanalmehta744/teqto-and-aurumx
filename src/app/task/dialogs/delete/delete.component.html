<h3 mat-dialog-title class="text-xl font-semibold text-gray-800 mb-4">Are you sure?</h3>

<div mat-dialog-content class="space-y-2">
    <ul class="space-y-1">
        <li>
            <p><span class="font-semibold text-gray-700">Task Title:</span> {{ data.title }}</p>
        </li>
        <li>
            <p><span class="font-semibold text-gray-700">Project Title:</span> {{ data.projectTitle ? data.projectTitle: data.trainer_project_name }}</p>
        </li>
        <li>
            <p><span class="font-semibold text-gray-700">Done:</span> {{ data.done ? 'Complete' : 'Incomplete' }}</p>
        </li>
    </ul>
</div>

<div mat-dialog-actions class="mt-4 flex justify-end gap-3">
    <button mat-raised-button class="!shadow-lg" color="warn" [mat-dialog-close]="1" (click)="confirmDelete()">
        Delete
    </button>
    <button mat-raised-button class="!shadow-lg" (click)="onNoClick()" tabindex="-1">
        Cancel
    </button>
</div>
