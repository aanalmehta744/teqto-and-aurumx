<h2 mat-dialog-title>{{ data.isNew ? 'New Task' : 'Edit Task' }}</h2>
<mat-dialog-content class="space-y-4 mt-1" [formGroup]="form">
    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Employee</mat-label>
        <mat-select formControlName="employee_id">
            <mat-option *ngFor="let emp of data.employees" [value]="emp.id">
                {{ emp.fullName }}
            </mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Employee Type</mat-label>
        <mat-select formControlName="employee_type">
            <mat-option value="regular">Regular</mat-option>
            <mat-option value="trainer">Trainer</mat-option>
        </mat-select>
    </mat-form-field>

    <!-- If Regular → Show Project dropdown -->
    <mat-form-field *ngIf="form.get('employee_type')?.value === 'regular'" class="w-full" appearance="outline">
        <mat-label>Project</mat-label>
        <mat-select formControlName="project_id">
            <mat-option *ngFor="let project of data.projects" [value]="project.id">
                {{ project.projectTitle }}
            </mat-option>
            <mat-option [value]="'other'">Other</mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Regular + "Other" → manual project name input -->
    <mat-form-field
        *ngIf="form.get('employee_type')?.value === 'regular' && form.get('project_id')?.value === 'other'"
        class="w-full" appearance="outline">
        <mat-label>Project Name</mat-label>
        <input matInput formControlName="trainer_project_name" />
    </mat-form-field>

    <!-- If Trainer → Show manual project name input -->
    <mat-form-field *ngIf="form.get('employee_type')?.value === 'trainer'" class="w-full" appearance="outline">
        <mat-label>Trainer Project Name</mat-label>
        <input matInput formControlName="trainer_project_name" />
    </mat-form-field>

    <!-- <mat-form-field class="w-full" appearance="outline">
        <mat-label>Project</mat-label>
        <mat-select formControlName="project_id">
            <mat-option *ngFor="let project of data.projects" [value]="project.id">
                {{ project.projectTitle }}
            </mat-option>
        </mat-select>
    </mat-form-field> -->



    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Priority</mat-label>
        <mat-select formControlName="priority">
            <mat-option value="Low">Low</mat-option>
            <mat-option value="Normal">Normal</mat-option>
            <mat-option value="High">High</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Due Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="due_date">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="done">
            <mat-option [value]="true">Complete</mat-option>
            <mat-option [value]="false">Incomplete</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-label>Event Details</mat-label>
    <div class="NgxEditor__Wrapper">
        <ngx-editor-menu class="text-gray-600" [editor]="editor!" [toolbar]="toolbar"></ngx-editor-menu>
        <ngx-editor [editor]="editor" formControlName="note" [placeholder]="'Type here...'" class="NgxEditorStyles">
        </ngx-editor>
    </div>
    <!-- <ngx-editor [editor]="editor" formControlName="note" placeholder="Event details"></ngx-editor> -->
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="save()">Save</button>
    <button mat-raised-button color="warn" (click)="close()">Cancel</button>
</mat-dialog-actions>
