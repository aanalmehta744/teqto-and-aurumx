<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix"></div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content>
    <h2 mat-dialog-title class="text-lg font-semibold">
      Download Payslip
    </h2>

    <mat-dialog-content class="mt-2 space-y-4">

      <!-- Show employee name -->
      <p *ngIf="data?.fullName" class="text-sm text-gray-700">
        Employee: <strong>{{ data.fullName }}</strong>
      </p>
      <!-- Month Selector -->
      <!-- Month Dropdown -->
      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Select Month</mat-label>
        <mat-select [(value)]="selectedMonth">
          <mat-option *ngFor="let month of months" [value]="month.value">
            {{ month.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <!-- Year Input -->
      <!-- <mat-form-field class="w-full" appearance="outline">
        <mat-label>Select Year</mat-label>
        <input matInput type=" number" [(ngModel)]="selectedYear" />
      </mat-form-field> -->

      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Select Year</mat-label>
        <input matInput type="number" [(ngModel)]="selectedYear" (ngModelChange)="onYearChange()" />
      </mat-form-field>

    </mat-dialog-content>

    <!-- ✅ FIXED: Use div with mat-dialog-actions -->
    <div mat-dialog-actions align="end" class="pt-4 space-x-2">
      <button mat-flat-button color="primary" (click)="onGenerate()">Generate</button>
      <!-- <button mat-flat-button color="accent" (click)="onDownload()">Download</button> -->
    </div>

  </div>
</div>
