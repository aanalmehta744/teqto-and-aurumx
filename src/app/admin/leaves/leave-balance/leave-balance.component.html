<section>
  <div class="mx-auto">
    <div class="mb-4">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Employees Leave Balance'" [items]="['Leaves']" [active_item]="'Employees Leave Balance'"></app-breadcrumb>
    </div>
    <div class="flex flex-wrap">
      <div class="w-full">
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

          <!-- Table Header -->
          <div class="flex flex-col md:flex-row justify-between items-center px-5 py-4 border-b border-gray-100">
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-[#0b0b88]"></span>
                <h6 class="text-sm font-semibold text-[#1B1B2F]">Employees Leave Balance</h6>
              </div>
              <div class="relative">
                <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 !text-[18px]">search</mat-icon>
                <input type="text" #filter
                  class="pl-9 pr-4 py-2 rounded-full border border-gray-200 bg-gray-50 text-sm focus:outline-none w-[220px] placeholder:text-gray-400"
                  placeholder="Search" (keyup)="applyFilter($event)" matInput id="inputoutline">
              </div>
            </div>
          </div>

          <!-- Table Body -->
          <div class="overflow-auto">
            <div class="min-w-full">
              <table mat-table [dataSource]="dataSource" matSort
                class="min-w-full border-collapse text-sm md:text-base">

                <!-- ID -->
                <ng-container matColumnDef="id">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Id</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.id }}</mat-cell>
                </ng-container>

                <!-- Name -->
                <ng-container matColumnDef="name">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.fullName }}</mat-cell>
                </ng-container>

                <!-- Total -->
                <ng-container matColumnDef="total">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Total Leaves</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.total }}</mat-cell>
                </ng-container>

                <!-- Used = Total − Remaining (calculated, not DB-driven) -->
                <ng-container matColumnDef="used">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Used Leaves</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ (+row.total || 0) - (+row.remaining || 0) }}</mat-cell>
                </ng-container>

                <!-- Remaining -->
                <ng-container matColumnDef="remaining">
                  <mat-header-cell *matHeaderCellDef mat-sort-header>Remaining Leaves</mat-header-cell>
                  <mat-cell *matCellDef="let row">{{ row.remaining }}</mat-cell>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                  <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
                  <mat-cell *matCellDef="let row">
                    <button mat-icon-button color="primary" matTooltip="View Leaves Taken"
                      (click)="viewLeaves(row); $event.stopPropagation()">
                      <mat-icon>event_note</mat-icon>
                    </button>
                    <button mat-icon-button color="primary" matTooltip="Edit Leave Balance"
                      (click)="editCall(row); $event.stopPropagation()">
                      <mat-icon>edit</mat-icon>
                    </button>
                  </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" class="cursor-pointer hover:bg-gray-50"
                  matRipple>
                </mat-row>

              </table>

              <!-- No results -->
              <div class="py-4 text-center text-gray-500"
                *ngIf="!exampleDatabase?.isTblLoading && dataSource.filteredData.length === 0">
                No results found
              </div>

            </div>
          </div>
          <mat-paginator #paginator [length]="dataSource.filteredData.length" [pageIndex]="0" [pageSize]="10"
            [pageSizeOptions]="[5, 10, 25, 100]" class="!border-t border-gray-100 !bg-white">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
